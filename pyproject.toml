[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poulet_py"
description = "A library which hosts various neuroscience python methods"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ['version']
license = "GPL-3.0-or-later"
authors = [
  { name = "Viktor Karamanis", email = "viktor.karamanis@outlook.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pydantic>=2.10.6,<2.11",
  "pydantic-settings>=2.8.1,<2.9",
  "python-dotenv>=1.0.1,<1.1",
  "rich>=13.9.4,<13.10",
]

keywords = ["poulet_py"]

[project.urls]
Homepage = "https://github.com/poulet-lab/poulet_py"
Documentation = "https://github.com/poulet-lab/poulet_py"
Changelog = "https://github.com/poulet-lab/poulet_py/release-notes/"
Source = "https://github.com/poulet-lab/poulet_py"


[tool.hatch.version]
path = "poulet_py/__init__.py"

[project.optional-dependencies]
hardware = [
  "pypylon>=3.0.1,<=4.0.0",
  "opencv-python==4.9.0.80",
  "numpy==1.26.4",
  "scipy==1.13.1",
  "matplotlib==3.9.0",
  "matplotlib-inline==0.1.7",
  "h5py==3.11.0",
  "keyboard==0.13.5",
  "pywin32==306; platform_system == 'Windows'",
  "pythonnet>=3.0.5,<3.1",
]

tools = []

utils = ["pandas==2.2.2"]

all = ["poulet_py[hardware,tools,utils]"]


[tool.hatch.envs.lint]
detached = true
require = ["default"]
dependencies = ["mypy", "ruff"]

[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive {args:poulet_py tests}"
style = "ruff check"
fmt = "ruff check --fix --exit-zero && ruff format"
all = ["style", "typing"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 80
indent-width = 4
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
  "I",
]
ignore = ["ISC001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402", "PLR2004", "S101", "TID252"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "auto"
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
known-first-party = ["poulet_py"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.8", "3.9", "3.10", "3.11", "3.12"]

[tool.coverage.run]
source_pkgs = ["poulet_py", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
poulet_py = ["poulet_py", "*/poulet-py/poulet_py"]
tests = ["tests", "*/poulet-py/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
