[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poulet_py"
description = "A library which hosts various neuroscience python methods"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dynamic = ['version']
license = "GPL-3.0-or-later"
authors = [
  { name = "Viktor Karamanis", email = "viktor.karamanis@outlook.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "pydantic==2.10.*",
  "pydantic-settings==2.8.*",
  "python-dotenv==1.0.*",
  "rich==13.9.*",
  "deprecated==1.2.*",
]

keywords = ["poulet_py"]

[project.urls]
Homepage = "https://github.com/poulet-lab/poulet_py"
Documentation = "https://github.com/poulet-lab/poulet_py"
Changelog = "https://github.com/poulet-lab/poulet_py/release-notes/"
Source = "https://github.com/poulet-lab/poulet_py"


[tool.hatch.version]
path = "poulet_py/__about__.py"

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
hardware = [
  "pypylon==4.1.*",
  "opencv-python==4.11.*",
  "numpy==2.2.*",
  "scipy==1.15.*",
  "matplotlib==3.10.*",
  "h5py==3.13.*",
  "keyboard==0.13.*",
  "pywin32==310; platform_system == 'Windows'",
  "pythonnet==3.0.*",
  "poulet_py[qst]",
]
qst = [
  "pytcsii @ git+https://github.com/mpcoll/pytcsii.git@main",
  "numpy==2.2.*",
  "pandas==2.2.*",
  "tqdm==4.67.*",
  "poulet_py[tools]",
]
tools = ["orjson==3.10.*"]

all = ["poulet_py[hardware,tools]"]

[tool.hatch.envs.lint]
detached = true
require = ["default"]
dependencies = ["mypy", "ruff"]

[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive {args:poulet_py tests}"
style = "ruff check"
fmt = "ruff check --fix --exit-zero && ruff format"
all = ["style", "typing"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 80
indent-width = 4
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
  "I",
]
ignore = ["ISC001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402", "PLR2004", "S101", "TID252"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "auto"
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
known-first-party = ["poulet_py"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.hatch.envs.hatch-test]
extra-dependencies = [
  "poulet-py[all]",
  "pytcsii @ git+https://github.com/mpcoll/pytcsii.git@main",
]


[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13"]
dependencies = ["poulet-py[all]"]
[tool.coverage.run]
source_pkgs = ["poulet_py", "tests"]
branch = true
parallel = true
omit = ["src/hello_world/__about__.py"]

[tool.coverage.paths]
poulet_py = ["poulet_py", "*/poulet-py/poulet_py"]
tests = ["tests", "*/poulet-py/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
